syntax = "proto3";
package com.apple.foundationdb.relational.distribution;
import "record_metadata.proto";
import "continuation.proto";

option java_multiple_files = true;
option java_package = "com.apple.foundationdb.relational.distribution";
option java_outer_classname = "DistributionOuter";

message DistributedQuery {
  optional bytes subspace = 1;
  optional com.apple.foundationdb.record.MetaData metaData = 2;
  optional com.apple.foundationdb.relational.continuation.CompiledStatement compiledStatement = 3;
}
